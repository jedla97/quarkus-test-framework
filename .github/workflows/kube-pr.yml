name: "PR"
on:
  issue_comment:
    types: [ created ]
jobs:
  write-comment:
    name: Write comment
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      (
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER'
      ) &&
      contains(github.event.comment.body, 'run kubernetes')
    outputs:
      comment_id: ${{ steps.create_comment.outputs.result }}
      head_sha: ${{ steps.get_pr_sha.outputs.pr_sha }}
      base_ref: ${{ steps.get_pr_sha.outputs.base_ref }}
    steps:
      - name: Get PR SHA
        id: get_pr_sha
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('pr_sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            return pr.data.head.sha;
      - name: Comment PR with Link
        id: create_comment
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚧 Kubernetes workflow run started and I'll update this comment with results! [View the run here](${runUrl})`
            });
            return comment.id;
  kubernetes-build-jvm-latest:
    name: Kubernetes JVM
    runs-on: ubuntu-latest
    needs: write-comment
    strategy:
      matrix:
        include:
          - quarkus-version: "999-SNAPSHOT"
            java: 17
            extra-maven-args: ''
    steps:
      - name: Check the SHA value from context
        run: echo "The PR SHA is ${{ needs.write-comment.outputs.head_sha }}  and ${{ needs.write-comment.outputs.base_ref }}"
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.write-comment.outputs.head_sha }}
      - name: Rebase onto base branch
        run: |
          git remote add quarkus_qe_target_repo https://github.com/jedla97/quarkus-test-framework.git
          git fetch quarkus_qe_target_repo ${{ needs.write-comment.outputs.base_ref }} --depth=15
          git config user.email "qe@quarkus"
          git config user.name "Quarkus QE"
          git rebase quarkus_qe_target_repo/${{ needs.write-comment.outputs.base_ref }}
      - name: test
        if: always()
        run: |
          git status
          git diff
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
          cache: 'maven'
      - name: Build
        run: |
          echo "JEDLA"

  update-comment:
    name: Update comment
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: [ write-comment, kubernetes-build-jvm-latest ]
    if: always()
    steps:
      - name: Update PR comment with status
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            let body;
            const jvmJobResult = '${{ needs.kubernetes-build-jvm-latest.result }}';
            
            if (jvmJobResult === 'success' && nativeJobResult === 'success') {
              body = `✅ Kubernetes workflow finished successfully! [View the details here](${runUrl})`;
            } else {
              body = `Kubernetes workflow failed. ❌ \n\n` +
                      `• **JVM Build**: ${jvmJobResult}\n` +
                      `• **Native Build**: ${nativeJobResult}\n\n` +
                      `[View the details here](${runUrl})`;
            }
            
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.write-comment.outputs.comment_id }},
              body: body
            });
